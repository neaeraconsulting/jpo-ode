spring:
  application:
    name: "jpo-ode-svcs"
  kafka:
    consumer:
      enable-auto-commit: true
      auto-commit-interval: ${KAFKA_AUTO_COMMIT_INTERVAL:1000}
      bootstrap-servers: ${ODE_KAFKA_BROKERS}
    producer:
      acks: "all"
      batch-size: 16384
      compression-type: "zstd"
      buffer-memory: 33554432
      bootstrap-servers: ${ODE_KAFKA_BROKERS}
    retry:
      topic:
        attempts: 0
    listener:
      log-container-config: true
      concurrency: ${ODE_KAFKA_LISTENER_CONCURRENCY:10}
  http:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
ode:
  security-services:
    host-ip: ${DOCKER_HOST_IP}
    port: 8090
    signature-endpoint: ${ODE_SECURITY_SVCS_SIGNATURE_URI}
    is-rsu-signing-enabled: ${DATA_SIGNING_ENABLED_RSU}
    is-sdw-signing-enabled: ${DATA_SIGNING_ENABLED_SDW}
  rsu:
    srm-slots: 100
    username: ${ODE_RSU_USERNAME}
    password: ${ODE_RSU_PASSWORD}
  kafka:
    brokers: ${ODE_KAFKA_BROKERS}
    kafka-type: ${KAFKA_TYPE}
    confluent:
      password: ${CONFLUENT_SECRET}
      username: ${CONFLUENT_KEY}
    producer:
      type: "sync"
      acks: ${KAFKA_ACKS}
      retries: ${KAFKA_RETRIES}
      batch-size: ${KAFKA_BATCH_SIZE}
      linger-ms: ${KAFKA_LINGER_MS}
      buffer-memory: ${KAFKA_BUFFER_MEMORY}
      key-serializer: ${KAFKA_KEY_SERIALIZER}
      value-serializer: ${KAFKA_VALUE_SERIALIZER}
      partitioner-class: ${KAFKA_PARTITIONER_CLASS}
      compression-type: ${KAFKA_COMPRESSION_TYPE}
    topics:
      json:
        bsm: "topic.OdeBsmJson"
        map: "topic.OdeMapJson"
        psm: "topic.OdePsmJson"
        spat: "topic.OdeSpatJson"
        srm: "topic.OdeSrmJson"
        ssm: "topic.OdeSsmJson"
        tim: "topic.OdeTimJson"
        sdsm: "topic.OdeSdsmJson"
        rtcm: "topic.OdeRtcmJson"
        rsm: "topic.OdeRsmJson"
        driver-alert: "topic.OdeDriverAlertJson"
        bsm-filtered: "topic.FilteredOdeBsmJson"
        spat-filtered: "topic.FilteredOdeSpatJson"
        tim-filtered: "topic.FilteredOdeTimJson"
        tim-tmc-filtered: "topic.OdeTimJsonTMCFiltered"
        tim-cert-expiration: "topic.OdeTIMCertExpirationTimeJson"
        tim-ktable: "topic.OdeTimKTableJson"
      raw-encoded-json:
        bsm: "topic.OdeRawEncodedBSMJson"
        map: "topic.OdeRawEncodedMAPJson"
        psm: "topic.OdeRawEncodedPSMJson"
        spat: "topic.OdeRawEncodedSPATJson"
        srm: "topic.OdeRawEncodedSRMJson"
        ssm: "topic.OdeRawEncodedSSMJson"
        tim: "topic.OdeRawEncodedTIMJson"
        sdsm: "topic.OdeRawEncodedSDSMJson"
        rtcm: "topic.OdeRawEncodedRTCMJson"
        rsm: "topic.OdeRawEncodedRSMJson"
      sdx-depositor:
        input: "topic.SDWDepositorInput"

  receivers:
    generic:
      buffer-size: 2000
      receiver-port: 44990
    bsm:
      buffer-size: 500
      receiver-port: 46800
    map:
      buffer-size: 2048
      receiver-port: 44920
    psm:
      buffer-size: 500
      receiver-port: 44940
    spat:
      buffer-size: 500
      receiver-port: 44910
    srm:
      buffer-size: 500
      receiver-port: 44930
    ssm:
      buffer-size: 500
      receiver-port: 44900
    tim:
      buffer-size: 2048
      receiver-port: 47900
    sdsm:
      buffer-size: 500
      receiver-port: 44950
    rtcm:
      buffer-size: 500
      receiver-port: 44960
    rsm:
      buffer-size: 2000
      receiver-port: 44970
  file-importer:
    buffer-size: 500
    backup-dir: "backup"
    failed-dir: "failed"
    time-period: 5
    upload-location-root: "uploads"
    obu-log-upload-location: "bsmlog"
  ffmlib:
    native-library-path: ${ODE_FFMLIB_NATIVE_LIB_PATH:}
    # Native MessageFrameCodec buffers (one instance per Kafka/UDP worker thread via ThreadLocal)
    text-buffer-size: ${ODE_FFMLIB_TEXT_BUFFER_SIZE:262144}
    uper-buffer-size: ${ODE_FFMLIB_UPER_BUFFER_SIZE:16384}
    error-buffer-size: ${ODE_FFMLIB_ERROR_BUFFER_SIZE:512}
    # Intermediate encoding after UPER: auto (JER when native lib supports it, else XER), jer, or xer
    intermediate-encoding: ${ODE_FFMLIB_INTERMEDIATE_ENCODING:auto}
    # UDP decode worker pool (0 = availableProcessors). Prep stays on the receive thread.
    udp-decode-workers: ${ODE_FFMLIB_UDP_DECODE_WORKERS:0}
    udp-decode-queue-capacity: ${ODE_FFMLIB_UDP_DECODE_QUEUE_CAPACITY:4096}
  tim-ingest-monitoring:
    tracking-enabled: ${ODE_TIM_INGEST_MONITORING_ENABLED}
    interval: ${ODE_TIM_INGEST_MONITORING_INTERVAL}
  stomp-exporter:
    enabled: ${ODE_STOMP_EXPORTER_ENABLED}
    channels:
      filtered-output: "/topic/filtered_messages"
      unfiltered-output: "/topic/unfiltered_messages"

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      enabled: true
